[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mydepthai"
version = "0.1.2"
description = "Scripts for depthai and cv2 cameras"
authors = [{name = "porteratzo", email = "44075849+porteratzo@users.noreply.github.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Not on PyPI: pinned to a release tag of the public repository.
    "tep-shared @ git+https://github.com/porteratzo/tep-shared.git@v0.2.0",
    "numpy>=1.24.0",
    "porter-bench>=0.2.0",
    "opencv-python>=4.8.0",
    "depthai>=3,<4",
    "redis>=5.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "jinja2>=3.0.0",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
mydepthai-broker = "mydepthai.broker.camera_broker:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27",  # starlette's TestClient (web UI tests): httpx on older starlette,
    "httpx2",  # httpx2 on starlette >= 1.x
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.0.0",
]

# Black configuration
[tool.setuptools.packages.find]
include = ["mydepthai*"]

# Non-Python files the installed package needs: the web UI templates and the default camera configs.
[tool.setuptools.package-data]
mydepthai = ["web/templates/*.html", "configs/defaults/*.json"]

[tool.black]
line-length = 110
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 110
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "build",
    "dist",
    "__pycache__",
]
known_first_party = ["mydepthai", "shared"]

# flake8 configuration (requires flake8-pyproject plugin)
[tool.flake8]
max-line-length = 110
extend-ignore = ["E203", "W503"]  # Black compatibility
max-complexity = 12
per-file-ignores = [
    "__init__.py:F401",
    "examples/*:C901",  # demo scripts are linear loops
    "mydepthai/broker/camera_broker.py:C901",  # CameraBroker.run is one long capture loop
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
    ".mypy_cache",
    ".tox",
]

# Pylint configuration
[tool.pylint.main]
ignore = ["__pycache__", ".git", ".venv", "venv", "build", "dist"]
jobs = 0
py-version = "3.12"

[tool.pylint.messages_control]
disable = [
    "C0103",  # invalid-name
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0902",  # too-many-instance-attributes
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0212",  # protected-access
    "fixme",
]

[tool.pylint.format]
max-line-length = 110

[tool.pylint.design]
max-args = 10
max-attributes = 15

# mypy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = [
    "build/",
    "dist/",
    "__pycache__/",
    ".venv/",
    "tests/",
]
