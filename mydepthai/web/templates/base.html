<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Camera Manager{% endblock %}</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --border: #e2e8f0;
            --primary: #4a9eff;
            --primary-dark: #2d7dd9;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --text: #1e293b;
            --text-muted: #64748b;
            --navbar-h: 54px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; padding-top: var(--navbar-h); background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }

        .navbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--navbar-h);
            background: #1a1f2e;
            border-bottom: 1px solid #2e3347;
            display: flex; align-items: center;
            padding: 0 20px; gap: 16px; z-index: 1000;
        }
        .nav-brand { font-size: 1rem; font-weight: 700; color: #4a9eff; white-space: nowrap; }
        .nav-links { display: flex; align-items: center; gap: 4px; }
        .nav-links a {
            color: #94a3b8; text-decoration: none;
            padding: 6px 12px; border-radius: 6px;
            font-size: 0.875rem; transition: color 0.15s, background 0.15s; white-space: nowrap;
        }
        .nav-links a:hover { color: #e2e8f0; background: #242938; }
        .nav-links a.active { color: #4a9eff; background: rgba(74,158,255,0.1); }

        /* Flash */
        #flashContainer { position: fixed; top: 66px; right: 16px; z-index: 2000; }
        .flash {
            padding: 12px 18px; border-radius: 8px; font-size: 0.875rem;
            max-width: 320px; margin-bottom: 8px;
            animation: slideIn 0.2s ease;
        }
        .flash.success { background: rgba(34,197,94,0.1); border: 1px solid #22c55e; color: #22c55e; }
        .flash.error   { background: rgba(239,68,68,0.1); border: 1px solid #ef4444; color: #ef4444; }
        .flash.info    { background: rgba(74,158,255,0.1); border: 1px solid #4a9eff; color: #4a9eff; }
        @keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:none} }

        /* Buttons */
        .btn { padding: 7px 16px; border-radius: 6px; font-size: 0.875rem; cursor: pointer; border: none; transition: background 0.15s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: none; border: 1px solid var(--border); color: var(--text-muted); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
<nav class="navbar">
    <span class="nav-brand">Camera Manager</span>
    <div class="nav-links">
        <a href="/" id="nav-cameras">Cameras</a>
        <a href="/status" id="nav-status">Status</a>
        <a href="/controls" id="nav-controls">Controls</a>
        {% if nav_links %}
        <span style="width:1px;height:20px;background:#2e3347;margin:0 8px;display:inline-block"></span>
        {% for link in nav_links %}
        <a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.label }} ↗</a>
        {% endfor %}
        {% endif %}
    </div>
</nav>

<div id="flashContainer"></div>

{% block content %}{% endblock %}

<script>
// the server embeds the POST token when it renders a page; every state-changing fetch sends it.
const _brokerToken = {{ broker_token | tojson }};
const _tokenHeader = {{ token_header | tojson }};
function authHeaders(extra = {}) {
    return Object.assign({ [_tokenHeader]: _brokerToken }, extra);
}
// Error body is {detail} for validation errors and {error} (project envelope) for auth failures.
function errorText(result, fallback) {
    return (result && (result.detail || result.error)) || fallback;
}

// Active nav
const _path = window.location.pathname;
document.querySelectorAll('.nav-links a[id^="nav-"]').forEach(a => {
    if (_path === a.getAttribute('href')) a.classList.add('active');
});

function showFlash(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = `flash ${type}`;
    el.textContent = msg;
    document.getElementById('flashContainer').appendChild(el);
    setTimeout(() => el.remove(), 4000);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
