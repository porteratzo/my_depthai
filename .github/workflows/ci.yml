name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "black==26.5.1" "isort==8.0.1" "flake8==7.3.0" flake8-pyproject mypy
      - name: Format and imports
        run: |
          black --check .
          isort --check-only .
      - name: Flake8
        run: flake8 mydepthai examples tests camera_broker.py
      - name: Mypy
        run: mypy mydepthai
      - name: Tests (no camera attached)
        run: pytest tests -m "not hardware and not manual" --cov=mydepthai --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and import the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          pip install dist/*.whl
          python -c "import mydepthai; print('imported', mydepthai.__file__)"
